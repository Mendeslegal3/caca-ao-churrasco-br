<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caça ao Churrasco</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#14101c;--tx:#f4d9b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Press Start 2P",monospace;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated;width:min(100%,calc((100vh - 150px)*2),900px);width:min(100%,calc((100dvh - 150px)*2),900px);height:auto;display:block;border-radius:10px;background:#000}
#jb{display:block;width:100%;max-width:900px;padding:16px 0;border:0;border-radius:8px;background:#009c3b;color:#ffd800;font:inherit;font-size:18px;box-shadow:0 5px 0 #005a22,inset 0 0 0 3px #ffd800;touch-action:manipulation;cursor:pointer}
#jb:active{transform:translateY(4px);box-shadow:0 1px 0 #005a22,inset 0 0 0 3px #ffd800}
#ctl{display:flex;gap:10px;width:100%;max-width:900px}
#ctl #jb{flex:1;width:auto}
#pb{width:72px;padding:16px 0;border:0;border-radius:8px;background:#ffd800;color:#14101c;font:inherit;font-size:18px;box-shadow:0 5px 0 #a88a00;touch-action:manipulation;cursor:pointer}
#pb:active{transform:translateY(4px);box-shadow:0 1px 0 #a88a00}
p{margin:0;font-size:9px;line-height:1.7;opacity:.8;text-align:center;padding:0 12px}
@media (max-height:520px){
 canvas{width:min(100%,calc((100vh - 16px)*2),900px);width:min(100%,calc((100dvh - 16px)*2),900px)}
 p{display:none}
 #ctl{display:contents}
 #pb{position:fixed;left:10px;bottom:10px;width:auto;padding:12px 18px;opacity:.85;z-index:5}
 #jb{position:fixed;right:10px;bottom:10px;width:auto;padding:12px 24px;opacity:.85;z-index:5}
}
#pb{display:none!important}
</style>
</head>
<body>
<canvas id="c" width="400" height="200"></canvas>
<div id="ctl"><button id="pb" type="button">II</button><button id="jb" type="button">PULAR</button></div>
<p>Toque na tela, no botão PULAR ou aperte Espaço / ↑. Dá pra pular duas vezes!</p>
<script>
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const W=800,H=400,GY=340,F='"Press Start 2P",monospace';
let best=0;try{best=+localStorage.getItem('cac_best')||0}catch(e){}
let introT=0,frozen=-1,talk={s:'',until:0},nextTalk=0,mouth=true,cutT=0,state='intro',t=0,dog,gap,speed,dist,sausages,objs,plats,sc,nextSp,over=0,shake=0,msg=0;
function reset(){
  dog={x:200,y:GY-28,vy:0,w:44,h:28,jumps:0,inv:0,g:true};
  gap=130;speed=280;dist=0;sausages=[];objs=[];plats=[];sc=0;nextSp=500;shake=0;talk.until=0;nextTalk=t+1.2;frozen=-1;
}
reset();
let btns=[];
function start(){state='play';mouth=true;paused=false;if(AC)AC.resume();reset()}
function startCut(){sfx(392,784,.25,'square',.05);state='cut';cutT=0;mouth=false;reset()}
function jump(){if(dog.jumps<2){dog.vy=dog.jumps?-590:-660;dog.jumps++;dog.g=false;sfx(420,760,.12,'square',.05);burst(dog.x+10,GY-4,0)}}
addEventListener('keydown',e=>{unlocked=true;if((e.code==='KeyP'||e.code==='Escape')&&state==='play')setPause(!paused);if(e.code==='KeyM')toggleMute();if(['Space','ArrowUp','KeyW','Enter'].includes(e.code)){e.preventDefault();if(!e.repeat){if(state==='play'){if(!paused)jump()}else if(state==='intro')state='menu';else if(state==='menu')startCut();else if(state==='cut')start();else if(state==='over'&&t-over>.5)start();else if(state==='win')start();else if(state==='fin')state='win'}}});
let lastP=0;
function press(e){
  if(e.cancelable)e.preventDefault();unlocked=true;
  if(state==='intro'){if(e.type==='pointerdown')state='menu';return}
  if(state==='cut'){if(e.type==='pointerdown')start();return}
  if(state==='fin'){if(e.type==='pointerdown')state='win';return}
  if(state==='play'&&!paused){if(e.type==='pointerdown'){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;if(px>=PB.x&&px<=PB.x+PB.w&&py>=PB.y&&py<=PB.y+PB.h)setPause(true);else jump()}return}
  if(e.type==='pointerdown')lastP=performance.now();else if(performance.now()-lastP<800)return;
  const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
  for(const b of btns)if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){b.fn();break}
}
addEventListener('pointerdown',press);addEventListener('click',press);
document.fonts&&document.fonts.load('20px "Press Start 2P"');

const R=(a,b)=>a+Math.random()*(b-a);
function spawn(){
  const x=W+60,r=Math.random();
  if(r<.28)objs.push({k:'cooler',x,y:GY-36,w:44,h:36});
  else if(r<.52)objs.push({k:'capi',x,y:GY-28,w:46,h:28});
  else if(r<.68)objs.push({k:'frisbee',x,y:GY-R(52,95),w:34,h:8,vx:130});
  else if(r<.78)objs.push({k:'grill',x,y:GY-62,w:42,h:62});
  else{
    plats.push({x,y:GY-100,w:150});
    for(let i=0;i<3;i++)sausages.push({x:x+25+i*50,y:GY-128,c:Math.random()<.1});
    if(Math.random()<.6)objs.push({k:'cooler',x:x+55,y:GY-36,w:44,h:36});
  }
  if(Math.random()<.65){const y=GY-R(30,110);for(let i=0;i<3;i++)sausages.push({x:x+260+i*34,y,c:Math.random()<.08})}
  nextSp=330+speed*.7+R(0,180);
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function update(dt){
  if(dog.g&&Math.random()<.18)burst(dog.x+4,GY-3,0);fxStep(dt);
  if(t>nextTalk){talk={s:LINES[(Math.random()*LINES.length)|0],until:t+2.2};nextTalk=t+R(3.5,5.5)}
  dist+=speed*dt;speed=Math.min(560,280+dist*.012);if(mode==='story'&&dist>=GOAL){startFin();return}
  gap=Math.min(200,gap-(5+speed*.008)*dt);
  nextSp-=speed*dt;if(nextSp<=0&&(mode==='endless'||dist<GOAL-1500))spawn();
  const prev=dog.y+dog.h;
  dog.vy+=1900*dt;dog.y+=dog.vy*dt;dog.inv=Math.max(0,dog.inv-dt);
  dog.g=false;
  if(dog.y+dog.h>=GY){dog.y=GY-dog.h;dog.vy=0;dog.g=true}
  else if(dog.vy>=0)for(const p of plats){
    if(dog.x+dog.w>p.x+6&&dog.x<p.x+p.w-6&&prev<=p.y+4&&dog.y+dog.h>=p.y){dog.y=p.y-dog.h;dog.vy=0;dog.g=true}
  }
  if(dog.g)dog.jumps=0;else if(dog.jumps===0)dog.jumps=1;
  for(const o of objs){o.x-=(speed+(o.vx||0))*dt}
  for(const p of plats)p.x-=speed*dt;
  for(const s of sausages)s.x-=speed*dt;
  objs=objs.filter(o=>o.x>-80);plats=plats.filter(p=>p.x>-200);sausages=sausages.filter(s=>s.x>-30);
  const db={x:dog.x+4,y:dog.y+3,w:dog.w-8,h:dog.h-5};
  for(const o of objs)if(dog.inv<=0&&hit(db,{x:o.x+3,y:o.y+3,w:o.w-6,h:o.h-4})){
    gap-=48;dog.inv=1.2;shake=.25;burst(dog.x+20,dog.y,3);sfx(160,60,.25,'sawtooth',.08);speed=Math.max(280,speed-50);talk={s:LINES[(Math.random()*LINES.length)|0],until:t+2};
  }
  sausages=sausages.filter(s=>{
    if(Math.abs(s.x-(dog.x+dog.w/2))<26&&Math.abs(s.y-(dog.y+dog.h/2))<26){sc+=s.c?30:10;burst(s.x,s.y,s.c?2:1,s.c?'+30':'+10');sfx(s.c?880:660,s.c?1320:990,.12,'triangle',.07);gap=Math.min(200,gap+(s.c?30:14));return false}
    return true;
  });
  shake=Math.max(0,shake-dt);
  if(gap<=0){state='over';over=t;sfx(300,60,.6,'square',.08);const s=score();if(s>best){best=s;try{localStorage.setItem('cac_best',best)}catch(e){}}}
}
const score=()=>frozen>=0?frozen:Math.floor(dist/10)+sc;

/* ---------- desenho ---------- */
function rr(x,y,w,h,r,c){x=Math.round(x/2)*2;y=Math.round(y/2)*2;w=Math.max(2,Math.round(w/2)*2);h=Math.max(2,Math.round(h/2)*2);ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,2));ctx.fill()}
function bg(){
  sky();stars();ctx.fillStyle='#ffe9b8';ctx.beginPath();ctx.arc(640,100,28,0,7);ctx.fill();clouds();far();bunting();
  // cerca
  const o2=(dist*.6)%40;ctx.fillStyle='#4a2c2a';
  for(let x=-o2;x<W+40;x+=40)ctx.fillRect(x,GY-58,30,58);
  ctx.fillRect(0,GY-44,W,8);
  // grama
  ctx.fillStyle=TH[theme].gr;ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle=TH[theme].gd;ctx.fillRect(0,GY,W,8);
  const o3=dist%60;ctx.fillStyle=TH[theme].gd;
  for(let x=-o3;x<W;x+=60)ctx.fillRect(x,GY+36,34,6);detail();
}
function drawDog(){
  if(dog.inv>0&&Math.floor(t*14)%2)return;
  const {x,y}=dog,l=dog.g?Math.sin(t*(speed/16))*6:0;
  ctx.strokeStyle='#7a4a22';ctx.lineWidth=6;ctx.lineCap='round';
  for(const [lx,s] of [[8,1],[14,-1],[30,-1],[36,1]]){ctx.beginPath();ctx.moveTo(x+lx,y+h2());ctx.lineTo(x+lx+l*s,y+dog.h+(dog.g?0:-3));ctx.stroke()}
  function h2(){return 20}
  ctx.beginPath();ctx.moveTo(x+2,y+6);ctx.lineTo(x-10,y-2+Math.sin(t*25)*4);ctx.stroke();
  rr(x,y,40,22,10,'#c98a4b');
  rr(x+28,y-10,20,18,7,'#d9a066');
  rr(x+30,y-12,7,13,3,'#6b3d1c');
  ctx.fillStyle='#111';ctx.fillRect(x+40,y-5,3,3);ctx.fillRect(x+46,y,4,4);
  // linguiça na boca
  if(mouth){ctx.save();ctx.translate(x+48,y+6);ctx.rotate(-.2);rr(-2,0,18,6,3,'#b8432f');ctx.restore()}
}
function drawGuy(){
  const x=dog.x-gap-50,b=Math.sin(t*14)*3,y=GY;
  ctx.strokeStyle='#2b2b3a';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+16,y-24);ctx.lineTo(x+16+Math.sin(t*14)*10,y);ctx.moveTo(x+34,y-24);ctx.lineTo(x+34-Math.sin(t*14)*10,y);ctx.stroke();
  rr(x+4,y-72+b,42,52,10,'#e9e2d0');
  rr(x+10,y-60+b,30,40,6,'#ffd800');rr(x+10,y-60+b,30,8,2,'#009c3b');
  rr(x+8,y-98+b,34,30,12,'#e8b98a');
  rr(x+10,y-122+b,30,28,10,'#fff');rr(x+6,y-100+b,38,8,3,'#fff');
  ctx.fillStyle='#222';ctx.fillRect(x+30,y-88+b,4,4);ctx.fillRect(x+20,y-76+b,22,4);
  ctx.strokeStyle='#999';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+44,y-50+b);ctx.lineTo(x+68,y-60+b-Math.sin(t*14)*5);ctx.stroke();
  if(gap<70&&state==='play'){ctx.font='12px '+F;ctx.textBaseline='alphabetic';tx('ÔÔ, MINHA LINGUIÇA!',Math.max(10,x),y-135)}
}
function sausage(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);rr(-13,-5,26,10,5,'#b8432f');rr(-10,-3,14,2,1,'#e07a5f');ctx.restore()}
function coxinha(x,y){ctx.fillStyle='#e0a030';ctx.beginPath();ctx.moveTo(x,y-14);ctx.lineTo(x+11,y+8);ctx.lineTo(x-11,y+8);ctx.fill();ctx.fillStyle='#f6c85f';ctx.fillRect(x-3,y-2,4,6)}
function drawObj(o){
  if(o.k==='cooler'){rr(o.x,o.y,o.w,o.h,3,'#f2f2f2');rr(o.x,o.y,o.w,10,3,'#cfd6dd');rr(o.x+8,o.y+16,o.w-16,10,2,'#2f6fd0')}
  else if(o.k==='capi'){rr(o.x,o.y+6,o.w,22,4,'#8a5a32');rr(o.x+o.w-18,o.y,18,16,4,'#9a6a3c');ctx.fillStyle='#222';ctx.fillRect(o.x+o.w-8,o.y+4,3,3);ctx.fillRect(o.x+o.w-2,o.y+8,3,3);ctx.fillStyle='#6b4222';ctx.fillRect(o.x+o.w-14,o.y-2,4,4);ctx.fillRect(o.x+4,o.y+24,6,4);ctx.fillRect(o.x+o.w-16,o.y+24,6,4)}
  else if(o.k==='frisbee'){ctx.fillStyle='#1fa84a';ctx.beginPath();ctx.ellipse(o.x+17,o.y+4,17,5,0,0,7);ctx.fill();ctx.strokeStyle='#ffd800';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x+24,o.y+4);ctx.lineTo(o.x+10,o.y);ctx.moveTo(o.x+24,o.y+4);ctx.lineTo(o.x+10,o.y+8);ctx.stroke()}
  else{rr(o.x,o.y,o.w,o.h-18,4,'#2b2b33');rr(o.x+4,o.y+6,o.w-8,6,2,'#ff5a1f');ctx.fillStyle='#2b2b33';ctx.fillRect(o.x+6,o.y+o.h-20,5,20);ctx.fillRect(o.x+o.w-11,o.y+o.h-20,5,20)}
}
function hud(){
  const bar=(x,w,f,col,lab,vl)=>{rr(x-4,32,w+8,36,3,'#fff');rr(x,36,w,28,2,'#000');rr(x+3,39,w-6,22,2,'#2a2236');if(f>0)rr(x+3,39,(w-6)*Math.min(1,f),22,2,col);
   ctx.textBaseline='middle';ctx.font='12px '+F;ctx.textAlign='left';tx(lab,x+10,51,'#fff');ctx.textAlign='right';tx(vl,x+w-10,51,'#fff');ctx.textAlign='left'};
  bar(18,236,score()/Math.max(best,mode==='endless'?3500:7000),'#e6a000','PONTOS',''+score());
  bar(304,192,gap/200,gap<70?'#ff4d3d':'#4fbf45','DISTÂNCIA','');
  if(mode==='endless')bar(546,236,(dist%10000)/10000,'#b44fe0','SEM FIM',Math.floor(dist/100)+'m');else bar(546,236,dist/GOAL,'#2f8fe0','CHEGADA',Math.max(0,Math.ceil((GOAL-dist)/100))+'m');
  rr(PB.x,PB.y,PB.w,PB.h,2,'#000');rr(PB.x+2,PB.y+2,PB.w-4,PB.h-4,2,'#ffd800');
  ctx.textBaseline='middle';ctx.textAlign='center';ctx.font='10px '+F;ctx.fillStyle='#14101c';ctx.fillText('II PAUSA',PB.x+PB.w/2,PB.y+PB.h/2+1);ctx.textAlign='left';
  ctx.textBaseline='top';
}
function tx(s,x,y,col){ctx.fillStyle='#000';ctx.fillText(s,x+2,y+2);ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function center(txt,y,size,col){ctx.textAlign='center';ctx.font=size+'px '+F;tx(txt,W/2,y,col);ctx.textAlign='left'}
function panel(){ctx.fillStyle='rgba(15,8,25,.55)';ctx.fillRect(0,0,W,H)}

const TH=[
 {n:'RIO DE JANEIRO',s:[[27,33,80],[122,59,110],[255,138,61]],gr:'#3d8a3f',gd:'#2f6f33',far:'rio'},
 {n:'SERTÃO',s:[[60,30,90],[220,90,60],[255,190,80]],gr:'#c98a3a',gd:'#a86d28',far:'ser'},
 {n:'AMAZÔNIA',s:[[10,50,60],[30,120,90],[170,220,110]],gr:'#2a6b30',gd:'#1f5224',far:'ama'}];
let theme=0;
const L=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
function sky(){const s=TH[theme].s;for(let y=0;y<GY;y+=12){const k=y/GY,c=k<.6?L(s[0],s[1],k/.6):L(s[1],s[2],(k-.6)/.4);ctx.fillStyle='rgb('+c.map(Math.round)+')';ctx.fillRect(0,y,W,12)}}
function far(){const o=(dist*.15)%800,f=TH[theme].far;
 for(let i=-1;i<2;i++){const x=i*800-o;
  if(f==='rio'){ctx.fillStyle='#3a1f4a';
   ctx.beginPath();ctx.moveTo(x+60,GY);ctx.lineTo(x+120,GY-110);ctx.lineTo(x+200,GY-120);ctx.lineTo(x+260,GY);ctx.fill();
   ctx.beginPath();ctx.moveTo(x+250,GY);ctx.lineTo(x+310,GY-70);ctx.lineTo(x+360,GY-75);ctx.lineTo(x+420,GY);ctx.fill();
   ctx.beginPath();ctx.moveTo(x+480,GY);ctx.lineTo(x+580,GY-130);ctx.lineTo(x+680,GY);ctx.fill();
   ctx.fillRect(x+576,GY-190,8,60);ctx.fillRect(x+556,GY-178,48,6);ctx.fillRect(x+575,GY-200,10,10)}
  else if(f==='ser'){ctx.fillStyle='#6b2a3a';ctx.fillRect(x+60,GY-90,120,90);ctx.fillRect(x+300,GY-60,160,60);
   ctx.fillStyle='#2b4a2a';for(const cx of [230,520,700]){ctx.fillRect(x+cx,GY-70,10,70);ctx.fillRect(x+cx-14,GY-50,14,8);ctx.fillRect(x+cx-14,GY-62,8,20);ctx.fillRect(x+cx+10,GY-44,14,8);ctx.fillRect(x+cx+16,GY-58,8,22)}}
  else{ctx.fillStyle='#0f3a2a';for(const cx of [80,260,430,600,740]){ctx.fillRect(x+cx,GY-110,10,110);ctx.beginPath();ctx.arc(x+cx+5,GY-120,38,0,7);ctx.fill()}}
 }}
function bunting(){const o=(dist*.3)%240,cols=['#2bd35f','#ffd800','#2f6fd0','#f4f4f4'];
 for(let x=-o-240;x<W+240;x+=240){ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,44);ctx.quadraticCurveTo(x+120,76,x+240,44);ctx.stroke();
  for(let i=1;i<6;i++){const u=i/6,px=x+240*u,py=44+2*u*(1-u)*32;ctx.fillStyle=cols[i%4];ctx.beginPath();ctx.moveTo(px-8,py);ctx.lineTo(px+8,py);ctx.lineTo(px,py+16);ctx.fill()}}}
function btn(label,x,y,w,h,fn,sz){btns.push({x,y,w,h,fn});rr(x,y,w,h,2,'#000');rr(x+3,y+3,w-6,h-6,2,'#ffd800');rr(x+8,y+8,w-16,h-16,2,'#009c3b');
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=(sz||16)+'px '+F;tx(label,x+w/2,y+h/2+1);ctx.textAlign='left';ctx.textBaseline='alphabetic'}
function screens(){
 btns=[];
 if(state==='intro'){const a=Math.max(0,Math.min(1,introT/.5,(3.2-introT)/.5));ctx.fillStyle='#14101c';ctx.fillRect(0,0,W,H);ctx.globalAlpha=a;
  ctx.textBaseline='alphabetic';center('ESTE JOGO FOI FEITO',178,24,'#ffd800');center('COM A CLAUDE.AI',218,24,'#ffffff');
  rr(250,238,300,4,0,'#009c3b');center('TOQUE PARA PULAR',382,10,'#888888');ctx.globalAlpha=1}
 else if(state==='menu'){
  center('CAÇA AO',112,18,'#ffd800');center('CHURRASCO',158+Math.round(Math.sin(t*3)*3),40,'#2bd35f');
  ctx.font='10px '+F;ctx.textAlign='right';tx('Recorde: '+best,W-16,24);ctx.textAlign='left';
  btn('JOGAR',190,176,420,40,startCut,20);
  btn('CENÁRIO: '+TH[theme].n,190,220,420,36,()=>{theme=(theme+1)%TH.length},14);
  btn('COMO JOGAR',190,262,200,36,()=>state='help',12);
  btn('PERSONAGENS',410,262,200,36,()=>state='chars',12);
  center('FEITO COM MUITA LINGUIÇA NO BRASIL',376,10,'#ffd800');btn('MODO: '+(mode==='story'?'HISTÓRIA':'SEM FIM'),630,262,160,36,()=>{mode=mode==='story'?'endless':'story'},9);btn('SOM: '+(mute?'NÃO':'SIM'),630,306,160,32,toggleMute,10);
 }else if(state==='help'){
  panel();rr(60,24,680,352,2,'rgba(15,8,25,.88)');center('COMO JOGAR',70,22,'#ffd800');
  ['TOQUE OU ESPAÇO = PULAR','APERTE 2X NO AR = PULO DUPLO','LINGUIÇA = +10 PONTOS','COXINHA = +30 PONTOS','BATEU? O CHURRASQUEIRO CHEGA PERTO','BARRA ZEROU? ELE TE PEGA!'].forEach((s,i)=>center(s,118+i*30,13));
  btn('VOLTAR',300,310,200,40,()=>state='menu',14);
 }else if(state==='chars'){
  panel();rr(60,24,680,352,2,'rgba(15,8,25,.88)');center('PERSONAGENS',64,20,'#ffd800');

 if(cineF>0){ctx.fillStyle='rgba(0,0,0,'+cineF+')';ctx.fillRect(0,0,W,H)}
}
let paused=false;const PB={x:686,y:78,w:96,h:30};
const pb=document.getElementById('pb');
function setPause(v){paused=v;if(AC){if(v)AC.suspend();else AC.resume()}}
pb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(state==='play')setPause(!paused)});
pb.addEventListener('click',e=>{e.stopPropagation();pb.blur()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)setPause(true)});
function pauseScreen(){btns=[];panel();rr(220,110,360,190,3,'#000');rr(224,114,352,182,3,'#ffd800');rr(228,118,344,174,3,'#0c1a2e');
 ctx.textBaseline='alphabetic';center('PAUSADO',162,28,'#ffd800');
 btn('CONTINUAR',250,184,300,40,()=>setPause(false),16);
 btn('MENU',250,236,300,40,()=>{paused=false;if(AC)AC.resume();reset();state='menu'},16)}
function frame(ts){try{tick(ts)}catch(e){console.error(e)}requestAnimationFrame(frame)}
function tick(ts){
  const dt=Math.min(.033,(ts-(frame.l||ts))/1000);frame.l=ts;t+=dt;
  if(state==='play'){if(!paused)update(dt)}else if(state==='intro'){introT+=dt;if(introT>3.2)state='menu'}else if(state==='cut'){cutT+=dt;if(cutT>5)start()}else if(state==='fin'){finT+=dt;dist+=Math.max(0,420*(1-Math.max(0,finT-.6)/2.2))*dt;fxStep(dt);if(finT>2.8&&Math.random()<.2)fx.push({x:finG+30,y:GY-110,vx:R(-20,20),vy:R(-30,0),l:.7,m:.7,c:'#6ec6ff'});if(finT>6.8)state='win'}else if(state!=='over')dist+=80*dt;
  jb.style.visibility=pb.style.visibility=state==='play'?'visible':'hidden';
  if(unlocked){const want=state==='play'?'chase':(state==='cut'||state==='over'||state==='intro')?null:'menu';if(want!==music)setMusic(want)}
  ctx.setTransform(.5,0,0,.5,0,0);ctx.imageSmoothingEnabled=false;ctx.save();if(shake>0)ctx.translate(R(-4,4),R(-4,4));
  OY=state==='cut'||state==='fin'?-60:0;if(OY){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.translate(0,OY)}bg();
  for(const p of plats){rr(p.x,p.y,p.w,10,3,'#a8703a');rr(p.x,p.y,p.w,4,2,'#c98a4b')}
  for(const s of sausages){const yy=s.y+Math.sin(t*5+s.x*.02)*3;s.c?coxinha(s.x,yy):sausage(s.x,yy,Math.sin(t*3+s.x)*.3)}
  if(state==='cut')drawCut();else if(state==='fin')drawFin();else{finLine();outlined(()=>{for(const o of objs)drawObj(o)});outlined(()=>{drawGuyX(dog.x-gap-50,14);drawDog()});fxDraw()}
  ctx.restore();
  ctx.textBaseline='alphabetic';
  if(state==='play'){if(talk.until>t)bubble(talk.s,dog.x-gap-50+25);hud();if(paused)pauseScreen()}
  if(state!=='play')screens();if(state==='cut'||state==='fin')cineOverlay();
}
